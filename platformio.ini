[platformio]
default_envs = api-device
[env:api-device]
platform = espressif32@6.6.0
board = 320x480
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -D LV_KCONFIG_IGNORE
    -D LV_CONF_INCLUDE_SIMPLE
    -D CJSON_NESTING_LIMIT=16
board_build.partitions = partitions.csv


